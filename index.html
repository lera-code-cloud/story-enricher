const APPROVED_HOSTS = APPROVED_DOMAINS.map(d => d.toLowerCase());

// ---------------------------------------------------------------------------
// Domains on the approved list that BLOCK the search crawler. The API rejects
// the whole request with a 400 if any of these is passed in allowed_domains,
// so they have to be excluded from the search restriction. They stay on
// APPROVED_DOMAINS above — a researcher can still cite them by hand — but this
// tool cannot retrieve or verify anything from them.
// Verified against the API's own error response on 2026-07-28.
// ---------------------------------------------------------------------------
const SEARCH_BLOCKED_DOMAINS = [
  "al.com","allure.com","apimages.com","argusleader.com","azcentral.com","bbc.co.uk","bbc.com",
  "burlingtonfreepress.com","businessinsider.com","chicagotribune.com","clarionledger.com",
  "cleveland.com","cosmopolitan.com","courant.com","courier-journal.com","dailymail.co.uk",
  "dailystar.co.uk","dallasnews.com","delawareonline.com","denverpost.com","desmoinesregister.com",
  "elle.com","esquire.com","ew.com","express.co.uk","freep.com","genius.com","glamour.com","gq.com",
  "harpersbazaar.com","houstonchronicle.com","idahostatesman.com","independent.co.uk","indystar.com",
  "instyle.com","jsonline.com","kansas.com","latimes.com","metro.co.uk","miamiherald.com",
  "mirror.co.uk","newsobserver.com","nj.com","nydailynews.com","nymag.com","nypost.com","nytimes.com",
  "oklahoman.com","oregonlive.com","pagesix.com","people.com","pitchfork.com","politico.com",

  "townandcountrymag.com","usatoday.com","usmagazine.com","vanityfair.com","vogue.com","vulture.com",
  "wsj.com"
];

// What actually gets passed to the search tool: approved AND reachable.
const SEARCHABLE_DOMAINS = APPROVED_DOMAINS.filter(d => SEARCH_BLOCKED_DOMAINS.indexOf(d) === -1);

function isApprovedHost(host) {
  host = String(host || '').replace(/^www\./, '').toLowerCase();
  return APPROVED_HOSTS.some(d => host === d || host.endsWith('.' + d));
}

const SYSTEM_PROMPT = `You are a research assistant for a digital media team. Your job is to suggest additional sources and ideas that can enrich a primary news article — not to summarize or repeat what the researcher already provided.
When a researcher gives you a news article (as text, a short description, or a URL), do NOT repeat, rephrase, or summarize the information from their input. Treat everything they shared as already known. Your only job is to suggest what is MISSING — new angles, external sources, additional context, and comparable cases they have not mentioned — so they can build a fuller article.

**Absolute rule — zero fabrication**
Inventing information is strictly forbidden and is the single worst thing you can do in this job. This is not a stylistic preference: an unverified sentence that reads plausibly is worse than an empty section, because a researcher will publish it. You may only state something if a specific article you found in a search says it. You may not infer it, reconstruct it, assume it, or write the version of events that "would normally" happen. If you have no source, you have no sentence — leave it out and say so.

**Research method — mandatory**
You have a web_search tool. Use it before you write anything, every single time, with no exceptions. Run several searches: the people involved, the specific case or event, then one search per comparable case, timeline event, or fashion detail you intend to cite. Build your answer only from what those searches actually return. You need a real, working article URL for every fact you keep — searching is the only way to get one, so never skip the searches and never write the answer from memory.

The search tool is hard-restricted at the API level to the approved outlets listed below: it is technically incapable of returning a result from any other website. Two consequences follow, and both matter. First, you never need to judge whether a source is allowed — if it came back from a search, it is approved. Second, if a search returns nothing, that does NOT mean you should look elsewhere, work around it, or supply the information yourself; it means no approved outlet has published this, and the honest answer is NOT FOUND. Never name an outlet you did not receive a result from, even one on the list.

Be aware that a large number of the approved outlets block the search crawler and are therefore unreachable from this tool — People, US Weekly, Page Six, NY Post, Daily Mail, The Sun, Daily Mirror, Metro, Entertainment Weekly, Vanity Fair, Vulture, New York Magazine, PopSugar, The Cut, Business Insider, The New York Times, Reuters, The Wall Street Journal, USA Today, The Guardian, BBC, The Independent, Politico, Los Angeles Times, Chicago Tribune, Vogue, Elle, GQ, Esquire, Cosmopolitan, Glamour, Harper's Bazaar, InStyle, Allure, Town & Country, Pitchfork, Genius, AP Images and most state-level regional papers among them. You will simply never see results from these, and that is expected — it is not a reason to reproduce their reporting from memory, to attribute a fact to them anyway, or to treat the story as unreported. Work with the outlets that do come back: TMZ, E! News, Entertainment Tonight, HollywoodLife, The Blast, Closer Weekly, The Hollywood Reporter, Variety, Deadline, Billboard, WWD, Parade, Extra, Access Hollywood, Yahoo Entertainment, Today, Good Morning America, Hello!, Rolling Stone, CNN, Fox News, NBC News, ABC News, CBS News, The Washington Post, Newsweek, Time, NPR, IMDb, CourtListener and Law & Crime.

**Source hierarchy — cite where it came from, not who repeated it**

Almost everything you find is a retelling. Your job is to hand the researcher the place a fact FIRST appeared, not the outlet that summarised it afterwards.

  TIER 0 — the artifact itself. The podcast episode, the YouTube video, the magazine essay, the court filing, the press release, the person's own verified post. Cite this whenever it exists and you can reach a working URL.

  TIER 1 — the outlet that did the work. If a quote came from an interview, the publication that CONDUCTED that interview is the source. Not whoever wrote it up an hour later.

  TIER 2 — a retelling. Acceptable only when Tier 0 and Tier 1 are genuinely unreachable, and it must be labelled honestly: Source: [Origin](origin-url), via [Outlet](outlet-url)

**The origin must also be an approved outlet**

Tracing a fact back to its origin does not override the approved source list. If the origin turns out to be an outlet that is NOT on the list — RadarOnline, aggregator blogs, celebrity gossip sites you were not given — then that fact is not usable. Do not cite it, not as the origin, not in a via line, not as a bare mention. Either find an approved outlet that reported the same thing independently, or delete the fact.

The single exception is a Tier 0 artifact rather than an outlet: a podcast episode page, a court filing, a government record, an official press release, a verified social post. Those are primary records, and they are usable even when the domain is not on the outlet list.

So the test is not "did I find where this came from" but "did I find where this came from, and is that a place I am allowed to cite". If the answer to the second half is no, the fact goes.

**How to find the origin — mandatory procedure**

You have a web_fetch tool in addition to web_search. Search alone returns only snippets; the link to the original almost always sits inside the article body, which you can only see by fetching it.

1. When a search result carries a fact you intend to use, web_fetch that article and read its body before you write the line.
2. Hunt for attribution language, and take the link attached to it: "told X", "in an interview with X", "said on the X podcast", "in a May 31 essay for X", "recalled in a 2021 interview", "per X", "speaking to X", "according to X", "first reported by X". In practice these phrases are hyperlinked to the original. That link is your real source.
3. web_fetch that link. If it loads and contains the fact, cite THAT url.
4. If the origin is an approved outlet but you cannot get a working URL for it — it is paywalled, it blocks the crawler, the fetch fails — you must still NAME it. Write the origin as plain text and link only the outlet you could actually reach:
   Source: People, via [Fox News](https://www.foxnews.com/entertainment/...)
   This is mandatory. Quietly presenting the retelling as the source, with no mention of who actually reported it, is the exact failure this tool exists to prevent. A named origin with no link is far more useful to a researcher than a link to whoever repeated it.
   Only attach a URL to the origin when a search or a fetch actually returned that URL. Never reconstruct it from the outlet's name and the headline.
5. For a quote from a podcast, find the episode itself on Apple Podcasts, Spotify or YouTube and link the individual episode page — not the show page. These platforms are reachable, so a podcast quote sourced to a gossip site is a failure, not a compromise.
6. Same for anything the person said themselves: their own verified post, reel or video is Tier 0 and is reachable. Prefer it over any write-up of it.

**Syndication platforms are not publishers**

Some approved domains do not report anything themselves — they republish other outlets' articles whole. Yahoo (yahoo.com, news.yahoo.com, Yahoo Entertainment, Yahoo Style) is the main one you will hit, and MSN, AOL and Microsoft Start behave the same way. An article on one of these is almost never theirs.

Whenever a result sits on one of these platforms:

1. Look at the top of the page for the publisher's logo, brand name, or byline block. On Yahoo it appears above the headline — HOLA!, Hello!, People, Parade, Variety and so on — with the original author's name under it. That publisher is the source, not Yahoo.
2. web_fetch the page and find the link back to the original: the publisher name in the byline is usually a link, and there is often a "View comments", "Continue reading" or canonical link pointing at the publisher's own URL. Take that URL.
3. Cite the publisher and its own URL. If you could not recover the publisher's URL, cite it in the via format and name the publisher explicitly: Source: [HOLA!](publisher-url), via [Yahoo Entertainment](yahoo-url) — and if you have no publisher URL at all, still name them: Source: HOLA!, via [Yahoo Entertainment](https://...)
4. Never write "Source: [Yahoo Entertainment](...)" for an article carrying another outlet's logo. Yahoo hosting a story is not Yahoo reporting it.
5. The publisher you uncover is still subject to the approved list. If the syndicated article turns out to come from an outlet you are not allowed to cite, drop the fact rather than crediting the platform instead.

The same test applies anywhere else: if the page shows another outlet's brand above the headline, or says "originally published on", or "this article first appeared on", then you are looking at a republication and the named outlet is the source.

Never cite an outlet for a quote that the outlet itself attributes to somebody else's interview. That is the single most common failure in this job and the one this tool exists to prevent.

If an article gives no attribution at all for a claim, that makes the claim weaker, not stronger. An unattributed retelling does not become primary just because it happens to be reachable.

Respond with the following structure — always in English:
---
**📌 Story summary**
2–3 sentences capturing the core of the story.
---
**🔍 Background & related themes**
3–4 points covering broader context a reader needs to understand this story. Include relevant concepts, ongoing trends, or systemic issues connected to the topic.
---
**🔁 Similar cases & precedents**
3–4 real-world examples of similar situations — from recent news or history. For each, briefly explain what happened and why it's comparable to this story.
---
**🕰 Timeline**
4–6 chronological events showing how this situation developed. Start from the earliest relevant moment and lead up to the current story.
---
**💡 Storytelling angles**
2–3 ideas for how this story could be framed to make it more engaging — a human angle, an unexpected detail, a contrast, a question the audience is already asking.
---
**👗 Celebrity appearance & style intelligence** *(include only when the story involves a celebrity's looks, outfit, beauty, or body)*

Apply whichever of the following sub-sections are relevant to the story:

- **Style history & reactions** — Find past moments when this celebrity was praised or criticized for their style or appearance. Note any previous outfits, looks, or aesthetic choices that are comparable to the current story.

- **Plastic surgery & procedures** — If the topic involves physical changes, search for: (a) any statements the celebrity has made about cosmetic procedures, and (b) expert opinions (surgeons, dermatologists) on whether procedures appear to have been done. Cite sources for both.

async function callApi(payload) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data;
}

// Joined without a separator: with web search the answer arrives as several text
// blocks that can split mid-sentence.
function textOf(data) {
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
}

// Every URL the tools actually saw. Two categories, and the difference matters:
//   cites — what search returned, or what fetch pulled down as a document;
//   body  — links found INSIDE a fetched article. This is where the pointers to
//           primary sources live (the "told X", "in an essay for X", "recalled
//           in a 2021 interview" hyperlinks). The old citationsOf() never saw
//           these, so the filter silently deleted every correctly-sourced line.
function knownUrls(data) {
  const cites = new Set();
  const body = new Set();

  (data.content || []).forEach(b => {
    if (b.type === 'text' && Array.isArray(b.citations)) {
      b.citations.forEach(c => {
        const u = c.url || (c.source && c.source.url);
        if (u) cites.add(u);
      });
    }
    if (b.type === 'web_search_tool_result' && Array.isArray(b.content)) {
      b.content.forEach(r => { if (r && r.url) cites.add(r.url); });
    }
    if (b.type === 'web_fetch_tool_result' && b.content) {
      if (b.content.url) cites.add(b.content.url);
      let raw = '';
      try { raw = JSON.stringify(b.content); } catch (e) { raw = ''; }
      raw.replace(/https?:\/\/[^\s"'\\<>)\]]+/g, u => {
        body.add(u.replace(/[.,;:]+$/, ''));
        return u;
      });
    }
  });

  return { cites: Array.from(cites), body: Array.from(body) };
}

function runResearch() {
  const input = document.getElementById('inputText').value.trim();
  if (!input) return;

  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');

// Runs the search restricted to SEARCHABLE_DOMAINS. Some publishers block the
// search crawler, and the API rejects the whole request with a 400 that names
// them — so if that happens, read the names out of the error, drop them, and try
// again. That keeps working if the blocked set changes on Anthropic's side.
// Whatever the search returns, the client-side filter still enforces the full
// approved list, so a failed restriction can never leak an unapproved outlet.
function parseBlockedDomains(message) {
  if (!/not accessible to our user agent/i.test(message)) return [];
  const listPart = message.slice(message.indexOf('['), message.indexOf(']') + 1);
  const found = [];
  listPart.replace(/'([^']+)'/g, (m, d) => { found.push(d.toLowerCase()); return m; });
  return found;
}

async function callWithSearch(base) {
  let domains = SEARCHABLE_DOMAINS.slice();

  for (let attempt = 1; attempt <= 4; attempt++) {
    const tool = { type: "web_search_20250305", name: "web_search", max_uses: 12 };
    if (domains.length) tool.allowed_domains = domains;

    // Deliberately WITHOUT allowed_domains: the whole point of fetch is to reach
    // the origin, which may well live off the approved list (a podcast host, a
    // court docket, a press release). The model can only fetch a URL that has
    // already appeared in context, and what actually reaches the output is
    // decided by the client-side filter below.
    const fetchTool = {
      type: "web_fetch_20250910",
      name: "web_fetch",
      max_uses: 10,
      max_content_tokens: 30000,
      citations: { enabled: true }
    };

    try {
      const data = await callApi(Object.assign({}, base, { tools: [tool, fetchTool] }));
      console.info('[story-enricher] search ran across ' + domains.length + ' approved, reachable domains');
      return data;
    } catch (e) {
      const newlyBlocked = parseBlockedDomains(e.message);
      if (newlyBlocked.length) {
        console.warn('[story-enricher] these approved outlets block the search crawler and were dropped: '
          + newlyBlocked.join(', ') + ' — add them to SEARCH_BLOCKED_DOMAINS to skip this round trip next time');
        domains = domains.filter(d => newlyBlocked.indexOf(d) === -1);
        continue;
      }
      console.warn('[story-enricher] search failed: ' + e.message);
      throw e;
    }
  }
  throw new Error('The search could not be run against the approved source list. Nothing was returned rather than risk an unsourced answer.');
}

async function runEnrichment(input, status, output, btn) {
  try {
    const data = await callWithSearch({
      model: MODEL,
      max_tokens: 8000,
      system: SYSTEM_PROMPT,
      messages: [{ role: "user", content: input }]
    });

    const box = document.getElementById('resultContent');
    let html = '';
    if (data.stop_reason === 'max_tokens') {
      html += '<div class="warn-line">⚠ response was cut off by the length limit — some sections may be incomplete</div>';
    }
    box.innerHTML = html + renderContent(textOf(data));
    filterOutput(box, knownUrls(data));

    output.style.display = 'block';
    status.innerHTML = '';
    output.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    status.innerHTML = '<span style="color:#c87070">Error: ' + escapeHtml(err.message) + '</span>';
  } finally {
    btn.disabled = false;
  }
}

function normUrl(u) {
  try {
    const p = new URL(u);
    return p.host.replace(/^www\./, '').toLowerCase() + p.pathname.replace(/\/+$/, '').toLowerCase();
  } catch (e) { return String(u); }
}

// Social platforms are allowed for direct quotes from official accounts only.
// Code cannot see a verification badge, but it CAN tell a post from a profile:
// a quote must point at the individual post or video that contains it.
const SOCIAL_POST_PATTERNS = {
  "instagram.com": /\/(p|reel|reels|tv)\//i,
  "threads.net":   /\/post\//i,
  "x.com":         /\/status\//i,
  "twitter.com":   /\/status\//i,
  "tiktok.com":    /\/video\//i,
  "facebook.com":  /\/(posts|videos|photo|permalink|reel|watch|story\.php)/i,
  "youtube.com":   /\/(watch|shorts|live)/i,
  "youtu.be":      /\/.+/
};

// Returns null when the host is not social, otherwise 'post' or 'profile'.
function socialKind(u) {
  const host = String(u.host || '').replace(/^www\./, '').toLowerCase();
  const key = Object.keys(SOCIAL_POST_PATTERNS)
    .find(d => host === d || host.endsWith('.' + d));
  if (!key) return null;
  const target = u.pathname + u.search;
  return SOCIAL_POST_PATTERNS[key].test(target) ? 'post' : 'profile';
}

// Approved domains that do not report anything themselves — they republish other
// outlets' work whole. They stay approved as a place to read a story, but they
// are never the source of one.
const SYNDICATION_HOSTS = ["yahoo.com","msn.com","aol.com","news.google.com"];

function isSyndicationHost(href) {
  let host;
  try { host = new URL(href).host.replace(/^www\./, '').toLowerCase(); }
  catch (e) { return false; }
  return SYNDICATION_HOSTS.some(d => host === d || host.endsWith('.' + d));
}

// Tier 0 outside the editorial list — NOT other outlets, but the artifacts
// themselves: the recording, the filing, the official statement. Only these may
// pass APPROVED_DOMAINS, and only when the tools actually saw them. Another
// publication never qualifies: an aggregator linking to a site does not make
// that site an approved source. (This is what let RadarOnline through before.)
const PRIMARY_ORIGIN_DOMAINS = [
  // podcast hosting / distribution
  "megaphone.fm","simplecast.com","libsyn.com","buzzsprout.com","podbean.com",
  "art19.com","omny.fm","acast.com","captivate.fm","transistor.fm","redcircle.com",
  "iheart.com","audacy.com","pca.st","overcast.fm","soundcloud.com",
  // press release wires
  "prnewswire.com","businesswire.com","globenewswire.com","newswire.ca"
];

function isPrimaryOriginHost(host) {
  host = String(host || '').replace(/^www\./, '').toLowerCase();
  // Any government or court domain is a primary record by definition.
  if (/(^|\.)gov$/.test(host) || /(^|\.)courts?\./.test(host)) return true;
  return PRIMARY_ORIGIN_DOMAINS.some(d => host === d || host.endsWith('.' + d));
}

function urlMatches(href, list) {
  const n = normUrl(href);
  return list.some(c => {
    const m = normUrl(c);
    return m === n || m.startsWith(n) || n.startsWith(m);
  });
}

// Does this link meet the source standard? Anything that fails is dropped
// silently along with the sentence that leaned on it.
function linkPasses(href, known) {
  let u;
  try { u = new URL(href); } catch (e) { return false; }

  const inCites = urlMatches(href, known.cites);
  const inBody = urlMatches(href, known.body);
  const approved = isApprovedHost(u.host);

  // Off the approved list: allowed only if it is a primary artifact (recording,
  // document, release) AND the tools genuinely saw it. Another outlet never
  // passes here, no matter who linked to it.
  if (!approved) {
    if (!isPrimaryOriginHost(u.host)) return false;
    if (!inBody && !inCites) return false;
  }

  const social = socialKind(u);
  // Social is allowed only as a link to the actual post, never an account page.
  if (social === 'profile') return false;
  if (social === 'post') return true;

  // A domain with no path is an outlet homepage, not an article.
  if (u.pathname === '' || u.pathname === '/') return false;

  // The URL has to be one the tools actually saw, not one the model wrote from
  // memory. Skipped when the response carried no URLs at all.
  if (!known.cites.length && !known.body.length) return true;
  return inCites || inBody;
}

// Walks the rendered answer and removes every line that does not meet the
// standard: no source, a source off the approved list, a homepage link, a
// social profile link, or a URL that never came back from a search or a fetch.
// Lines whose only source is a syndication platform are kept but flagged, since
// the fact may still be worth having — the researcher just has to find who
// actually reported it. Sections left with nothing are removed entirely.
function filterOutput(container, known) {
  let dropped = 0;
  let syndicated = 0;

  container.querySelectorAll('.block').forEach(block => {
    const titleEl = block.querySelector('.block-title');
    const title = titleEl ? titleEl.textContent : '';
    const needsSource = SOURCED_SECTION_RE.test(title);
    const p = block.querySelector('p');
    if (!p) return;

    const kept = [];
    p.innerHTML.split(/<br\s*\/?>/i).forEach(frag => {
      const plain = frag.replace(/<[^>]*>/g, '').trim();
      if (!plain) return;
      if (plain.length < 25) { kept.push(frag); return; }   // sub-headings, spacers
      if (/NOT FOUND/i.test(plain)) { dropped++; return; }

      const hrefs = [];
      frag.replace(/href="([^"]+)"/gi, (m, h) => { hrefs.push(h); return m; });

      if (!hrefs.length) {
        if (needsSource) { dropped++; return; }             // a claim with no source
        kept.push(frag);                                    // summary / angles
        return;
      }
      if (hrefs.some(h => !linkPasses(h, known))) { dropped++; return; }

      if (hrefs.every(isSyndicationHost)) {
        syndicated++;
        kept.push(frag + ' <span class="syndic">⟳ передрук — знайдіть оригінал</span>');
        return;
      }
      kept.push(frag);
    });

    const substantive = kept.filter(f => f.replace(/<[^>]*>/g, '').trim().length >= 25);
    if (!substantive.length) { block.remove(); return; }
    p.innerHTML = kept.join('<br>');
  });

  const parts = [];
  if (dropped) parts.push(dropped + ' item(s) without an approved source were left out.');
  if (syndicated) parts.push(syndicated + ' item(s) are sourced to a syndication platform — the original publisher was not resolved.');
  if (parts.length) {
    const note = document.createElement('div');
    note.className = 'omit-note';
    note.textContent = parts.join(' ');
    container.appendChild(note);
  }
}

async function runAmoLookup(input, output) {
  const box = document.getElementById('amoContent');
  output.style.display = 'block';
  box.innerHTML = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>'
    + '<div class="amo-empty">Searching the CMS <span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';

  try {
    const data = await callApi({
      use_amo_es: true,
      model: AMO_MODEL,
      max_tokens: 6000,
      system: AMO_SYSTEM_PROMPT,
      messages: [{ role: "user", content: "Primary story the researcher is working on:\n\n" + input }]
    });
    const parsed = extractJson(textOf(data));
    if (!parsed) throw new Error('The archive lookup returned an unreadable answer. Try Generate again.');
    box.innerHTML = renderAmo(parsed);
  } catch (err) {
    box.innerHTML = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>'
      + '<div class="amo-empty" style="color:#c87070">Could not reach the archive: ' + escapeHtml(err.message) + '</div></div>';
  }
}

function extractJson(text) {
  if (!text) return null;
  const cleaned = text.replace(/```json/g, '').replace(/```/g, '').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start === -1 || end === -1) return null;
  try {
    return JSON.parse(cleaned.slice(start, end + 1));
  } catch (e) {
    return null;
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderAmo(data) {
  let html = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>';

  if (data.topic) {
    html += '<div class="amo-topic">Searched for: <strong>' + escapeHtml(data.topic) + '</strong></div>';
  }

  const items = Array.isArray(data.articles) ? data.articles : [];

  if (!items.length) {
    html += '<div class="amo-empty">' + escapeHtml(data.notes || 'No AMO articles on this case were found. Write the background from external sources instead.') + '</div>';
    return html + '</div>';
  }

  items.forEach(a => {
    const sameEvent = a.tier !== 'same_person_other_story';
    html += '<div class="amo-item ' + (sameEvent ? 'tier-same' : 'tier-other') + '">';
    html += '<div class="amo-head"><div class="amo-headline">' + escapeHtml(a.headline || 'Untitled') + '</div>'
      + '<div class="amo-badge ' + (sameEvent ? 'badge-same' : 'badge-other') + '">'
      + (sameEvent ? 'Same story' : 'Same person · other story') + '</div></div>';

    const meta = [a.published_at, a.site, a.id ? 'ID ' + a.id : null].filter(Boolean).map(escapeHtml).join(' · ');
    if (meta) html += '<div class="amo-meta">' + meta + '</div>';

    if (a.why) html += '<div class="amo-line"><span class="k">Why</span>' + escapeHtml(a.why) + '</div>';
    if (a.use_as) html += '<div class="amo-line"><span class="k">Use as</span>' + escapeHtml(a.use_as) + '</div>';
    if (a.transition) html += '<div class="amo-line"><span class="k">Transition</span><em>' + escapeHtml(a.transition) + '</em></div>';
    if (a.repeat_risk) html += '<div class="amo-line warn"><span class="k">Already used</span>' + escapeHtml(a.repeat_risk) + '</div>';

    html += '<div class="amo-links">';
    if (a.web_url) html += '<a href="' + escapeHtml(a.web_url) + '" target="_blank" rel="noopener">Open on site ↗</a>';
    if (a.admin_url) html += '<a href="' + escapeHtml(a.admin_url) + '" target="_blank" rel="noopener">Open in CMS ↗</a>';
    html += '</div></div>';
  });

  if (data.structure_tip) {
    html += '<div class="amo-topic" style="margin-top:16px">Structure: <strong>' + escapeHtml(data.structure_tip) + '</strong></div>';
  }
  if (data.notes) {
    html += '<div class="amo-topic">' + escapeHtml(data.notes) + '</div>';
  }

  return html + '</div>';
}

function renderContent(text) {
  const sections = text.split(/\n---\n/);
  return sections.map(sec => {
    sec = sec.trim();
    if (!sec) return '';
    const lines = sec.split('\n');
    let title = '', body = [];
    if (lines[0].startsWith('**') && lines[0].endsWith('**')) {
      title = lines[0].replace(/\*\*/g,'').replace(/\*/g,'').trim();
      body = lines.slice(1);
    } else {
      body = lines;
    }
    const html = body.join('\n')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/\[([^\]]+)\]\((https?[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g,'<br>');
    return `<div class="block">${title ? `<div class="block-title">${title}</div>` : ''}<p>${html}</p></div>`;
  }).join('');
}

function copyResult() {
  const main = document.getElementById('resultContent').innerText;
  const amo = document.getElementById('amoContent').innerText;
  const text = [main, amo].filter(t => t.trim()).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelectorAll('.tool-btn')[0];
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

function resetTool() {
  document.getElementById('inputText').value = '';
  document.getElementById('output').style.display = 'none';
  document.getElementById('resultContent').innerHTML = '';
  document.getElementById('amoContent').innerHTML = '';
  document.getElementById('status').innerHTML = '';
  document.getElementById('inputText').focus();
}

document.getElementById('inputText').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runResearch();
});
</script>
