Respond with the following structure — always in English:

**📌 Story summary**
2–3 sentences capturing the core of the story.
---
**🔍 Background & related themes**
3–4 points covering broader context a reader needs to understand this story. Include relevant concepts, ongoing trends, or systemic issues connected to the topic.
---
**🔁 Similar cases & precedents**
3–4 real-world examples of similar situations — from recent news or history. For each, briefly explain what happened and why it's comparable to this story.

const DEFAULT_AMO_PROMPT = `You are the AMO archive scout inside an editorial research tool. A researcher is writing a new article. Your job is to search AMO's own CMS (Elasticsearch) and return the previously published AMO articles that can safely be reused as SECONDARY CONTENT (a background section) inside that specific new article.

You have one tool: the "amo-es" MCP server (Elasticsearch). Index: "posts".

## What makes a candidate good or bad
These rules come from a performance analysis of 12 published articles measured by average intext IPP (benchmark: 12.5; fiction average: 26.52). Follow them exactly — they decide what you return.

1. SAME STORY, NOT SAME PERSON. This is the strongest predictor by far. The background must cover the same case, event, or storyline as the researcher's input. An article about the same celebrity but a different storyline is a weak candidate: the lowest-scoring article in the analysis (9.61) had a perfectly written transition sentence but the background was an unrelated old story about the same person. A good transition cannot rescue the wrong topic.
2. NO REPEATS. Never suggest material whose central quote or fact already appears in the researcher's input. One article did everything else right and still fell below the benchmark purely because it re-used a quote already published earlier in the same piece.
3. IT MUST READ LIKE A STORY. Prefer candidates rich in timestamps, direct quotes, and rising tension over flat recaps or list-style roundups.
4. LENGTH IS IRRELEVANT. Background can be 8% or 70% of the finished article — the top scorer in the analysis was 70% background. Never filter or rank by word count.
5. REUSE IS FINE. The same background article can feed several different pieces about the same case without hurting any of them.
6. The shift into background must always be labelled in the finished article ("As we previously reported…"), so supply a ready transition line for every candidate.

## Search procedure
1. Read the researcher's input and identify: the people involved, the specific case/event, and 2–4 distinctive keywords (full names, case name, location, event name).
2. Start narrow — headline-level matching:
{"size": 25, "_source": ["id","public_id","main_headline","title","description","slug","sites","status","language","published_at"], "sort": [{"_score": "desc"}, {"published_at": "desc"}], "query": {"bool": {"filter": [{"term": {"status": 3}}, {"term": {"language": "en"}}], "must": [{"multi_match": {"query": "KEYWORDS", "fields": ["main_headline^4","title^4","slug^3","description^2"], "type": "best_fields"}}]}}}
3. If that returns fewer than 3 relevant hits, broaden: add "body" to the fields, or drop the language filter, or search the case name alone. Run at most 4 searches total, then answer with what you have.

6. Return at most 6 candidates. Quality over quantity — returning 2 strong ones is better than padding with weak ones.

let currentPrompt = localStorage.getItem('storyEnricherPrompt') || DEFAULT_PROMPT;
let currentAmoPrompt = localStorage.getItem('storyEnricherAmoPrompt') || DEFAULT_AMO_PROMPT;
let activeTab = 'main';

document.getElementById('promptEditor').value = currentPrompt;

function toggleEditor() {
  const wrap = document.getElementById('promptEditor-wrap');
  const btn = document.getElementById('settingsToggle');
  const isOpen = wrap.classList.toggle('open');
  btn.classList.toggle('active', isOpen);
}

function switchTab(tab) {
  // keep whatever is currently typed before switching away
  const box = document.getElementById('promptEditor');
  if (activeTab === 'main') currentPrompt = box.value; else currentAmoPrompt = box.value;
  activeTab = tab;
  box.value = tab === 'main' ? currentPrompt : currentAmoPrompt;
  document.getElementById('tab-main').classList.toggle('active', tab === 'main');
  document.getElementById('tab-amo').classList.toggle('active', tab === 'amo');
}

function flashSaved() {
  const badge = document.getElementById('savedBadge');
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 2000);
}

function savePrompt() {
  const val = document.getElementById('promptEditor').value;
  if (activeTab === 'main') {
    currentPrompt = val;
    localStorage.setItem('storyEnricherPrompt', val);
  } else {
    currentAmoPrompt = val;
    localStorage.setItem('storyEnricherAmoPrompt', val);
  }
  flashSaved();
}

function resetPrompt() {
  const def = activeTab === 'main' ? DEFAULT_PROMPT : DEFAULT_AMO_PROMPT;
  document.getElementById('promptEditor').value = def;
  if (activeTab === 'main') {
    currentPrompt = def;
    localStorage.setItem('storyEnricherPrompt', def);
  } else {
    currentAmoPrompt = def;
    localStorage.setItem('storyEnricherAmoPrompt', def);
  }
  flashSaved();
}

async function callApi(payload) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data;
}

function textOf(data) {
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}

function runResearch() {
  const input = document.getElementById('inputText').value.trim();
  if (!input) return;

  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const useAmo = document.getElementById('amoToggle').checked;

  btn.disabled = true;
  output.style.display = 'none';
  document.getElementById('resultContent').innerHTML = '';
  document.getElementById('amoContent').innerHTML = '';
  status.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

  // Both calls run in parallel — the archive lookup is slower, so it fills in after.
  const enrich = runEnrichment(input, status, output, btn);
  if (useAmo) runAmoLookup(input, output);
  return enrich;
}

async function runEnrichment(input, status, output, btn) {
  try {
    const data = await callApi({
      model: MODEL,
      max_tokens: 4000,
      system: currentPrompt,
      messages: [{ role: "user", content: input }]
    });
    document.getElementById('resultContent').innerHTML = renderContent(textOf(data));
    output.style.display = 'block';
    status.innerHTML = '';
    output.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    status.innerHTML = '<span style="color:#c87070">Error: ' + err.message + '</span>';
  } finally {
    btn.disabled = false;
  }
}

async function runAmoLookup(input, output) {
  const box = document.getElementById('amoContent');
  output.style.display = 'block';
  box.innerHTML = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>'
    + '<div class="amo-empty">Searching the CMS <span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';

  try {
    const data = await callApi({
      use_amo_es: true,
      model: AMO_MODEL,
      max_tokens: 6000,
      system: currentAmoPrompt,
      messages: [{ role: "user", content: "Primary story the researcher is working on:\n\n" + input }]
    });
    const parsed = extractJson(textOf(data));
    if (!parsed) throw new Error('The archive lookup returned an unreadable answer. Try Generate again.');
    box.innerHTML = renderAmo(parsed);
  } catch (err) {
    box.innerHTML = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>'
      + '<div class="amo-empty" style="color:#c87070">Could not reach the archive: ' + escapeHtml(err.message) + '</div></div>';
  }
}

function extractJson(text) {
  if (!text) return null;
  const cleaned = text.replace(/```json/g, '').replace(/```/g, '').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start === -1 || end === -1) return null;
  try {
    return JSON.parse(cleaned.slice(start, end + 1));
  } catch (e) {
    return null;
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderAmo(data) {
  let html = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>';

  if (data.topic) {
    html += '<div class="amo-topic">Searched for: <strong>' + escapeHtml(data.topic) + '</strong></div>';
  }

  const items = Array.isArray(data.articles) ? data.articles : [];

  if (!items.length) {
    html += '<div class="amo-empty">' + escapeHtml(data.notes || 'No AMO articles on this case were found. Write the background from external sources instead.') + '</div>';
    return html + '</div>';
  }

  items.forEach(a => {
    const sameEvent = a.tier !== 'same_person_other_story';
    html += '<div class="amo-item ' + (sameEvent ? 'tier-same' : 'tier-other') + '">';
    html += '<div class="amo-head"><div class="amo-headline">' + escapeHtml(a.headline || 'Untitled') + '</div>'
      + '<div class="amo-badge ' + (sameEvent ? 'badge-same' : 'badge-other') + '">'
      + (sameEvent ? 'Same story' : 'Same person · other story') + '</div></div>';

    const meta = [a.published_at, a.site, a.id ? 'ID ' + a.id : null].filter(Boolean).map(escapeHtml).join(' · ');
    if (meta) html += '<div class="amo-meta">' + meta + '</div>';

    if (a.why) html += '<div class="amo-line"><span class="k">Why</span>' + escapeHtml(a.why) + '</div>';
    if (a.use_as) html += '<div class="amo-line"><span class="k">Use as</span>' + escapeHtml(a.use_as) + '</div>';
    if (a.transition) html += '<div class="amo-line"><span class="k">Transition</span><em>' + escapeHtml(a.transition) + '</em></div>';
    if (a.repeat_risk) html += '<div class="amo-line warn"><span class="k">Already used</span>' + escapeHtml(a.repeat_risk) + '</div>';

    html += '<div class="amo-links">';
    if (a.web_url) html += '<a href="' + escapeHtml(a.web_url) + '" target="_blank" rel="noopener">Open on site ↗</a>';
    if (a.admin_url) html += '<a href="' + escapeHtml(a.admin_url) + '" target="_blank" rel="noopener">Open in CMS ↗</a>';
    html += '</div></div>';
  });

  if (data.structure_tip) {
    html += '<div class="amo-topic" style="margin-top:16px">Structure: <strong>' + escapeHtml(data.structure_tip) + '</strong></div>';
  }
  if (data.notes) {
    html += '<div class="amo-topic">' + escapeHtml(data.notes) + '</div>';
  }

  return html + '</div>';
}

function renderContent(text) {
  const sections = text.split(/\n---\n/);
  return sections.map(sec => {
    sec = sec.trim();
    if (!sec) return '';
    const lines = sec.split('\n');
    let title = '', body = [];
    if (lines[0].startsWith('**') && lines[0].endsWith('**')) {
      title = lines[0].replace(/\*\*/g,'').replace(/\*/g,'').trim();
      body = lines.slice(1);
    } else {
      body = lines;
    }
    const html = body.join('\n')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/\[([^\]]+)\]\((https?[^\)]+)\)/g,'<a href="$2" target="_blank">$1</a>')
      .replace(/\n/g,'<br>');
    return `<div class="block">${title ? `<div class="block-title">${title}</div>` : ''}<p>${html}</p></div>`;
  }).join('');
}

function copyResult() {
  const main = document.getElementById('resultContent').innerText;
  const amo = document.getElementById('amoContent').innerText;
  const text = amo.trim() ? main + '\n\n' + amo : main;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelectorAll('.tool-btn')[0];
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

function resetTool() {
  document.getElementById('inputText').value = '';
  document.getElementById('output').style.display = 'none';
  document.getElementById('resultContent').innerHTML = '';
  document.getElementById('amoContent').innerHTML = '';
  document.getElementById('status').innerHTML = '';
  document.getElementById('inputText').focus();
}

document.getElementById('inputText').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runResearch();
});
