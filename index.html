<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Enricher</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #e8e0d8;
    min-height: 100vh;
    background-color: #121212;
  }
  header { background: rgba(26,26,26,0.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 0.5px solid #2e2e2e; padding: 18px 40px; display: flex; align-items: center; justify-content: space-between; }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo { width: 44px; height: 44px; background: #e8e0d8; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
  .logo span { font-family: 'Playfair Display', serif; font-size: 20px; font-style: italic; color: #1a1a1a; letter-spacing: 0.02em; }
  header h1 { font-size: 15px; font-weight: 500; color: #e8e0d8; letter-spacing: .02em; }
  header span { font-size: 13px; color: #6b6560; }
  .container { max-width: 820px; margin: 48px auto; padding: 0 28px; }
  .input-card { background: transparent; border: 0.5px solid rgba(200,184,154,0.2); border-radius: 16px; padding: 28px 32px; margin-bottom: 24px; }
  .input-card label { display: block; font-size: 11px; font-weight: 500; color: #6b6560; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
  textarea#inputText { width: 100%; background: rgba(18,18,18,0.25); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border: 0.5px solid rgba(200,184,154,0.25); border-radius: 10px; padding: 16px; font-size: 15px; font-family: inherit; color: #e8e0d8; resize: vertical; min-height: 140px; outline: none; transition: border-color .2s; line-height: 1.6; }
  textarea#inputText::placeholder { color: #4a4540; }
  textarea#inputText:focus { border-color: rgba(200,184,154,0.6); background: rgba(18,18,18,0.45); }
  .btn-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  button#submitBtn { background: #e8e0d8; color: #121212; border: none; border-radius: 10px; padding: 13px 28px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s, opacity .2s; letter-spacing: .01em; }
  button#submitBtn:hover { background: #fff; }
  button#submitBtn:disabled { opacity: .35; cursor: not-allowed; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b6560; cursor: pointer; user-select: none; letter-spacing: .02em; }
  .toggle input { appearance: none; -webkit-appearance: none; width: 34px; height: 19px; border-radius: 10px; background: #2e2e2e; position: relative; cursor: pointer; transition: background .2s; outline: none; flex-shrink: 0; }
  .toggle input::after { content: ''; position: absolute; top: 2.5px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #6b6560; transition: transform .2s, background .2s; }
  .toggle input:checked { background: rgba(200,184,154,0.28); }
  .toggle input:checked::after { transform: translateX(14px); background: #c8b89a; }
  .toggle input:focus-visible { box-shadow: 0 0 0 2px #c8b89a; }
  .toggle input:checked + span { color: #c8b89a; }
  #status { font-size: 13px; color: #6b6560; }
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #c8b89a; margin: 0 2px; animation: pulse .9s infinite alternate; }
  .dot:nth-child(2) { animation-delay: .3s; }
  .dot:nth-child(3) { animation-delay: .6s; }
  @keyframes pulse { from { opacity: .2; } to { opacity: 1; } }
  #output { display: none; }
  .result-card { background: #1a1a1a; border: 0.5px solid #2e2e2e; border-radius: 16px; padding: 36px 40px; }
  .result-toolbar { display: flex; justify-content: flex-end; margin-bottom: 24px; gap: 10px; }
  .tool-btn { background: none; border: 0.5px solid #2e2e2e; border-radius: 8px; padding: 7px 16px; font-size: 12px; font-family: inherit; color: #9a8f85; cursor: pointer; transition: border-color .2s, color .2s; letter-spacing: .02em; }
  .tool-btn:hover { border-color: #c8b89a; color: #e8e0d8; }
  .result-body { font-size: 15px; line-height: 1.8; color: #d4ccc4; }
  .result-body .block { margin-bottom: 28px; }
  .result-body .block-title { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #6b6560; font-weight: 500; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 0.5px solid #2e2e2e; }
  .result-body p { margin-bottom: 10px; }
  .result-body strong { color: #e8e0d8; font-weight: 500; }
  .result-body a { color: #c8b89a; text-decoration: none; border-bottom: 0.5px solid #c8b89a44; transition: border-color .2s; }
  .result-body a:hover { border-color: #c8b89a; }
  .result-body em { color: #9a8f85; font-style: normal; }

  /* ---- quiet note when material was filtered out ---- */
  .omit-note { font-size: 11px; color: #4a4540; margin-top: 26px; letter-spacing: .02em; }
  .warn-line { font-size: 12px; color: #c8a870; margin-bottom: 18px; }

  /* ---- AMO archive block ---- */
  .amo-topic { font-size: 13px; color: #6b6560; margin-bottom: 18px; }
  .amo-topic strong { color: #9a8f85; font-weight: 500; }
  .amo-item { border: 0.5px solid #2e2e2e; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; transition: border-color .2s; }
  .amo-item:hover { border-color: rgba(200,184,154,0.35); }
  .amo-item.tier-other { border-left: 2px solid #c8955a; }
  .amo-item.tier-same { border-left: 2px solid #6b9a7a; }
  .amo-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 8px; }
  .amo-headline { font-size: 15px; color: #e8e0d8; font-weight: 500; line-height: 1.45; }
  .amo-badge { flex-shrink: 0; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 3px 9px; border-radius: 6px; white-space: nowrap; }
  .badge-same { background: rgba(107,154,122,0.14); color: #7cae8c; }
  .badge-other { background: rgba(200,149,90,0.14); color: #c8955a; }
  .amo-meta { font-size: 12px; color: #6b6560; margin-bottom: 12px; }
  .amo-line { font-size: 14px; line-height: 1.65; color: #d4ccc4; margin-bottom: 7px; }
  .amo-line .k { color: #6b6560; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin-right: 7px; }
  .amo-line.warn { color: #c89a8a; }
  .amo-links { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .amo-links a { font-size: 12px; padding: 6px 13px; border: 0.5px solid #2e2e2e; border-radius: 8px; color: #9a8f85; text-decoration: none; transition: all .2s; }
  .amo-links a:hover { border-color: #c8b89a; color: #e8e0d8; }
  .amo-empty { font-size: 14px; color: #6b6560; line-height: 1.7; }

  /* ---- locale switcher ---- */
  .locale-switch { display: flex; align-items: center; gap: 0; border: 0.5px solid #2e2e2e; border-radius: 10px; padding: 3px; background: rgba(18,18,18,0.4); }
  .loc-btn { background: none; border: none; font-family: inherit; font-size: 12px; letter-spacing: .03em; color: #6b6560; padding: 7px 15px; border-radius: 7px; cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
  .loc-btn:hover { color: #9a8f85; }
  .loc-btn.active { background: rgba(200,184,154,0.14); color: #c8b89a; }
  .loc-btn:disabled { opacity: .4; cursor: not-allowed; }
  @media (max-width: 620px) {
    header { padding: 14px 18px; flex-wrap: wrap; gap: 12px; }
    header span { display: none; }
    .container { margin: 28px auto; padding: 0 16px; }
    .input-card { padding: 20px 18px; }
    .result-card { padding: 24px 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo"><span>SE</span></div>
    <h1>story enricher</h1>
    <span>/ digital media</span>
  </div>
  <div class="locale-switch" id="localeSwitch">
    <button class="loc-btn" data-locale="us" onclick="setLocale('us')">USA</button>
    <button class="loc-btn" data-locale="de" onclick="setLocale('de')">Germany</button>
    <button class="loc-btn" data-locale="latam" onclick="setLocale('latam')">LatAm</button>
  </div>
</header>

<div class="container">

  <div class="input-card">
    <label>Input — article, URL, or photo links</label>
    <textarea id="inputText" placeholder="Paste article text, a short description, a URL, or a list of photo links…"></textarea>
    <div class="btn-row">
      <button id="submitBtn" onclick="runResearch()">Generate</button>
      <label class="toggle" title="Search AMO's own published articles for background you can reuse">
        <input type="checkbox" id="amoToggle" checked>
        <span id="amoToggleLabel">Search AMO archive</span>
      </label>
      <div id="status"></div>
    </div>
  </div>

  <div id="output">
    <div class="result-card">
      <div class="result-toolbar">
        <button class="tool-btn" onclick="copyResult()">Copy</button>
        <button class="tool-btn" onclick="resetTool()">New</button>
      </div>
      <div class="result-body" id="resultContent"></div>
      <div class="result-body" id="amoContent"></div>
    </div>
  </div>

</div>

<script>
// Model used for both calls. Switch the archive call to a cheaper model here if needed.
const MODEL = "claude-opus-4-6";
const AMO_MODEL = "claude-opus-4-6";

// ---------------------------------------------------------------------------
// LOCALES
// ---------------------------------------------------------------------------
// The tool runs one desk at a time. A locale bundles everything that differs
// between desks: the approved outlet list, the language the searches are run
// in, the language filter used on the AMO archive, and the two system prompts.
// Everything else — the output structure, the source filter, the rendering —
// is shared and identical for every locale.
//
// The answer is ALWAYS written in English, in every locale. Only the searching
// and the archive lookup change language.
//
// TO ADD A NEW DESK (e.g. LatAm):
//   1. add an EXTRA_DOMAINS array below with the outlets that desk needs;
//   2. add an entry to LOCALES with label / esLanguage / the three prompt
//      paragraphs (langBlock, sourceBlock, blockedNote) and amoLangBlock;
//   3. add one <button class="loc-btn" data-locale="…"> to the header.
// Nothing else has to change.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// BASE (US) APPROVED DOMAINS — the hard allowlist for the American desk, and
// the shared foundation every other desk builds on.
// This is passed to the search tool as `allowed_domains`, so the model cannot
// receive results from anywhere else. Bare domains only: no https://, no paths,
// no wildcards. Subdomains are covered automatically.
// To add or remove an outlet, edit these arrays — the names in the prompt are
// documentation, THIS is what actually restricts the search.
// ---------------------------------------------------------------------------
const BASE_DOMAINS = [

  "theguardian.com","independent.co.uk","newsweek.com","time.com","politico.com","axios.com",

  "wikipedia.org","ancestry.com","findagrave.com","legacy.com","genius.com","boxofficemojo.com",

  "gettyimages.com","apimages.com","backgrid.com","shutterstock.com",

  // State-level flagships not already listed above
  "al.com","adn.com","azcentral.com","arkansasonline.com","courant.com","delawareonline.com",
  "staradvertiser.com","idahostatesman.com","indystar.com","desmoinesregister.com","kansas.com",

  "startribune.com","clarionledger.com","stltoday.com","billingsgazette.com","omaha.com","unionleader.com",

];

// ---------------------------------------------------------------------------
// GERMAN DESK — added on top of BASE_DOMAINS (outlets already present in the
// base list, and subdomains of them such as sportbild.bild.de or
// edition.cnn.com, are not repeated here: a bare domain already covers its
// subdomains).
// ---------------------------------------------------------------------------
const DE_EXTRA_DOMAINS = [
  // German national press & magazines
  "bild.de","spiegel.de","focus.de","stern.de","welt.de","faz.net","sueddeutsche.de","zeit.de",

  "ardmediathek.de","mdr.de","ndr.de","swr.de","wdr.de","sportschau.de","dw.com",
  "berliner-kurier.de","derwesten.de","express.de","fr.de","ga.de","hna.de","lvz.de","merkur.de",
  "nordkurier.de","nw.de","rp-online.de","saechsische.de","tz.de","volksfreund.de",
  "abendzeitung-muenchen.de","ostseewelle.de","badesalz.de","eurosport.de",
  // Austria & Switzerland
  "krone.at","kurier.at","heute.at","oe24.at","blick.ch","20min.ch","bluewin.ch",
  // European & international, used by the German desk
  "elpais.com","ilsole24ore.com","ladepeche.fr","belganewsagency.eu","kyivindependent.com",
  "news.sky.com","theage.com.au","majorcadailybulletin.com","thephuketnews.com","mabumbe.com",
  "nbcmiami.com","derechadiario.com.ar",
  // Official / institutional records
  "berlin.de","polizei.bayern.de","police.nsw.gov.au","deutschebahn.com",
  "dieter-schwarz-stiftung.de","gofundme.com",

// ---------------------------------------------------------------------------
// LATAM DESK — added on top of BASE_DOMAINS. Same rule as the German list:
// outlets already in the base list, and subdomains of them (edition.cnn.com,
// cnnespanol.cnn.com, us.marca.com), are not repeated here.
// The desk writes in Spanish but its beat is the whole region, so the list
// spans Argentina, Mexico, the Andean countries, Central America, the
// Caribbean, Spain and the US Hispanic press — plus a few Brazilian titles in
// Portuguese for stories that cross the border.
// ---------------------------------------------------------------------------
const LATAM_EXTRA_DOMAINS = [
  // Argentina
  "infobae.com","clarin.com","lanacion.com.ar","a24.com","tn.com.ar","ciudad.com.ar",
  "caras.perfil.com","revistagente.com","parati.com.ar","paparazzi.com.ar","pronto.com.ar",
  "eltrecetv.com.ar","viapais.com.ar","cenital.com","datachaco.com","derechadiario.com.ar",
  // Mexico
  "milenio.com","excelsior.com.mx","elfinanciero.com.mx","heraldodemexico.com.mx",
  "diariodemexico.com","proceso.com.mx","publimetro.com.mx","oem.com.mx","vanguardia.com.mx",
  "unotv.com","lasestrellas.tv","tvnotas.com.mx","quien.com","gq.com.mx",
  // Andean, Central America & the Caribbean
  "eltiempo.com","elespectador.com","semana.com","elcolombiano.com","bluradio.com","elcomercio.pe",
  "larepublica.pe","rpp.pe","radionacional.gob.pe","eluniverso.com","lanacion.com.py",
  "extra.com.py","listindiario.com","diariolibre.com","observador.cr","ncrnoticias.com","tiempo.hn",
  "tunota.com","wapa.tv",
  // Brazil (Portuguese-language)
  "g1.globo.com","cnnbrasil.com.br","caras.com.br","oliberal.com",
  // Spain
  "elpais.com","elmundo.es","elespanol.com","lavanguardia.com","hola.com","lecturas.com",
  "diezminutos.es","semana.es","marca.com",
  // US Hispanic press & LatAm-facing English
  "univision.com","peopleenespanol.com","laopinion.com","latintimes.com","mamaslatinas.com",
  "remezcla.com","diariolasamericas.com","fox26houston.com","newsnationnow.com",
  // International titles used by the desk
  "news.sky.com","skynews.com.au","thetimes.com","timesofindia.indiatimes.com",
  "economictimes.indiatimes.com","hindustantimes.com","telegrafi.com",
  // Official / institutional records
  "cdc.gov","gofundme.com",
  // Video platform (direct quotes from official channels only)
  "dailymotion.com",
  // Asset & internal hosts (approved for linking, never searched)
  "docs.google.com","google.com","imgur.com","postimg.cc"
];

// Hosts that are approved for LINKING but must never be handed to the search
// tool: they are asset stores, image CDNs or internal systems behind a login,
// so a search restriction that includes them just wastes crawler scope.
const UTILITY_DOMAINS = [
  "amooffice.com","drive.google.com","docs.google.com","google.com","imgur.com","postimg.cc"
];

// ---------------------------------------------------------------------------
// Domains on the approved list that BLOCK the search crawler. The API rejects
// the whole request with a 400 if any of these is passed in allowed_domains,
// so they have to be excluded from the search restriction. They stay on the
// approved list — a researcher can still cite them by hand — but this tool
// cannot retrieve or verify anything from them.
// Verified against the API's own error response on 2026-07-28;
// nola.com and threads.net added 2026-08-18 from a live 400.
// The German additions have NOT been verified yet: whatever turns out to be
// blocked is discovered on the first run, remembered in localStorage per
// locale (see learnedBlocked below), and can then be pasted in here.
// ---------------------------------------------------------------------------
const SEARCH_BLOCKED_DOMAINS = [
  "al.com","allure.com","apimages.com","argusleader.com","azcentral.com","bbc.co.uk","bbc.com",
  "nola.com","threads.net",
  "burlingtonfreepress.com","businessinsider.com","chicagotribune.com","clarionledger.com",
  "cleveland.com","cosmopolitan.com","courant.com","courier-journal.com","dailymail.co.uk",
  "dailystar.co.uk","dallasnews.com","delawareonline.com","denverpost.com","desmoinesregister.com",
  "elle.com","esquire.com","ew.com","express.co.uk","freep.com","genius.com","glamour.com","gq.com",
  "harpersbazaar.com","houstonchronicle.com","idahostatesman.com","independent.co.uk","indystar.com",
  "instyle.com","jsonline.com","kansas.com","latimes.com","metro.co.uk","miamiherald.com",
  "mirror.co.uk","newsobserver.com","nj.com","nydailynews.com","nymag.com","nypost.com","nytimes.com",
  "oklahoman.com","oregonlive.com","pagesix.com","people.com","pitchfork.com","politico.com",
  "popsugar.com","providencejournal.com","reuters.com","richmond.com","sfchronicle.com",
  "tennessean.com","thecut.com","theguardian.com","thesun.co.uk","timesunion.com",
  "townandcountrymag.com","usatoday.com","usmagazine.com","vanityfair.com","vogue.com","vulture.com",
  "wsj.com"
];

const LOCALES = {

  us: {
    id: 'us',
    label: 'USA',
    desk: 'the American desk',
    domains: BASE_DOMAINS,
    blocked: SEARCH_BLOCKED_DOMAINS,
    maxSearches: 12,
    esLanguage: 'en',
    archiveLabel: 'English',
    // Ready-to-paste transition lines are written in the language the finished
    // article is written in. Change this string to 'English' if the desk wants
    // them in English instead.
    transitionLanguage: 'English',
    langBlock: '',
    sourceBlock: '',

// ---------------------------------------------------------------------------
// Blocked-domain memory. The API tells us which outlets its crawler cannot
// reach, but only by rejecting the request first. Remembering the answer per
// locale means that round trip is paid once, not on every run.
// ---------------------------------------------------------------------------
function learnedBlocked(id) {
  try { return JSON.parse(localStorage.getItem('seBlocked:' + id) || '[]'); }
  catch (e) { return []; }
}
function rememberBlocked(id, list) {
  try {
    const merged = learnedBlocked(id).concat(list)
      .filter((d, i, a) => a.indexOf(d) === i).sort();
    localStorage.setItem('seBlocked:' + id, JSON.stringify(merged));
  } catch (e) { /* private mode — nothing to remember */ }
}

// What actually gets passed to the search tool: approved AND reachable.
function searchableDomains(L) {
  const out = L.blocked.concat(learnedBlocked(L.id)).concat(UTILITY_DOMAINS);
  return L.domains.filter(d => out.indexOf(d) === -1);
}

function isApprovedHost(host, L) {
  host = String(host || '').replace(/^www\./, '').toLowerCase();
  return L.domains.some(d => {
    d = d.toLowerCase();
    return host === d || host.endsWith('.' + d);
  });
}

// ---------------------------------------------------------------------------
// Active locale. Persisted so a researcher who only ever works one desk never
// has to think about the switch again.
// ---------------------------------------------------------------------------
let ACTIVE = 'us';
try {
  const saved = localStorage.getItem('storyEnricherLocale');
  if (saved && LOCALES[saved]) ACTIVE = saved;
} catch (e) { /* private mode */ }

function locale() { return LOCALES[ACTIVE]; }

function setLocale(id) {
  if (!LOCALES[id] || id === ACTIVE) { paintLocale(); return; }
  ACTIVE = id;
  try { localStorage.setItem('storyEnricherLocale', id); } catch (e) {}
  // A result produced for one desk must never sit under another desk's label.
  // The input is deliberately left alone: switching desks after pasting an
  // article should not throw the article away.
  clearResults();
  paintLocale();
}

function paintLocale() {
  const L = locale();
  document.querySelectorAll('.loc-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.locale === ACTIVE);
  });
  const amoLabel = document.getElementById('amoToggleLabel');
  if (amoLabel) amoLabel.textContent = 'Search AMO archive (' + L.archiveLabel + ')';
}

function buildSystemPrompt(L) { return `You are a research assistant for a digital media team. Your job is to suggest additional sources and ideas that can enrich a primary news article — not to summarize or repeat what the researcher already provided.
When a researcher gives you a news article (as text, a short description, or a URL), do NOT repeat, rephrase, or summarize the information from their input. Treat everything they shared as already known. Your only job is to suggest what is MISSING — new angles, external sources, additional context, and comparable cases they have not mentioned — so they can build a fuller article.

**Absolute rule — zero fabrication**
Inventing information is strictly forbidden and is the single worst thing you can do in this job. This is not a stylistic preference: an unverified sentence that reads plausibly is worse than an empty section, because a researcher will publish it. You may only state something if a specific article you found in a search says it. You may not infer it, reconstruct it, assume it, or write the version of events that "would normally" happen. If you have no source, you have no sentence — leave it out and say so.

${L.langBlock}

**Research method — mandatory**
You have a web_search tool. Use it before you write anything, every single time, with no exceptions. Run several searches: the people involved, the specific case or event, then one search per comparable case, timeline event, or fashion detail you intend to cite. Build your answer only from what those searches actually return. You need a real, working article URL for every fact you keep — searching is the only way to get one, so never skip the searches and never write the answer from memory.

The search tool is hard-restricted at the API level to the approved outlets listed below: it is technically incapable of returning a result from any other website. Two consequences follow, and both matter. First, you never need to judge whether a source is allowed — if it came back from a search, it is approved. Second, if a search returns nothing, that does NOT mean you should look elsewhere, work around it, or supply the information yourself; it means no approved outlet has published this, and the honest answer is NOT FOUND. Never name an outlet you did not receive a result from, even one on the list.

${L.sourceBlock}

${L.blockedNote}

Respond with the following structure — always in English:
---
**📌 Story summary**
2–3 sentences capturing the core of the story.
---
**🔍 Background & related themes**
3–4 points covering broader context a reader needs to understand this story. Include relevant concepts, ongoing trends, or systemic issues connected to the topic.
---
**🔁 Similar cases & precedents**
3–4 real-world examples of similar situations — from recent news or history. For each, briefly explain what happened and why it's comparable to this story.
---
**🕰 Timeline**
4–6 chronological events showing how this situation developed. Start from the earliest relevant moment and lead up to the current story.
---
**💡 Storytelling angles**
2–3 ideas for how this story could be framed to make it more engaging — a human angle, an unexpected detail, a contrast, a question the audience is already asking.
---
**👗 Celebrity appearance & style intelligence** *(include only when the story involves a celebrity's looks, outfit, beauty, or body)*

Apply whichever of the following sub-sections are relevant to the story:

- **Style history & reactions** — Find past moments when this celebrity was praised or criticized for their style or appearance. Note any previous outfits, looks, or aesthetic choices that are comparable to the current story.

- **Plastic surgery & procedures** — If the topic involves physical changes, search for: (a) any statements the celebrity has made about cosmetic procedures, and (b) expert opinions (surgeons, dermatologists) on whether procedures appear to have been done. Cite sources for both.

- **Fashion details** — Identify the exact brand(s), designer(s), and specific model or collection of each piece the celebrity is actually wearing in this appearance (clothing, shoes, bag, jewelry, etc.). Look up the stylist credited for this look. Include real retail or resale prices for the specific items worn. Note whether each piece is from a current collection, a past season, or custom-made. Do not list generic brand associations — only what is directly tied to this specific outfit.

- **Who wore it / wore it similarly** — Search for other celebrities or public figures who previously appeared in the same or a visually similar outfit, makeup look, hairstyle, or accessories. Note any meaningful comparisons (same event type, same era, same designer).

- **Photo set analysis** *(use when the input is a list of photo URLs with no accompanying text)* — Analyze the visual content of the provided photos and identify: the occasion or context, key style elements, any notable details (jewelry, makeup, body language, setting), and interesting facts or comparisons that could serve as editorial captions or story hooks.

---
**📚 Sourcing**
Every fact, date, death, case, event, quote, or statistic you cite MUST come from a result the search tool actually returned. The tool is hard-restricted to the approved outlet list at the API level, so anything that comes back is by definition an approved outlet and there is no list for you to check against. If you cannot attribute a fact to something a search returned, omit that fact entirely rather than guess, generalize, or substitute a different source.

Official verified social accounts (primary — celebrity's/rep's own words, for direct quotes only): Instagram, Threads, X (Twitter), TikTok, Facebook, YouTube — verified/official accounts only.

Rules for social sources specifically:
- Use them ONLY for the person's own words: a quote, a statement, a caption, or something said on camera. Never use a social post as the source for a fact about a third party, a date, a legal development, or anything the account holder is not personally asserting.
- The account must be the subject's own official/verified account, their representative's, or the official account of the brand or organisation involved. Never a fan account, a repost account, a news aggregator account, a clip account, or an account whose ownership you cannot establish. If you cannot establish that the account is the official one, do not use it — find the same quote reported by one of the approved outlets instead, and cite that outlet.

---
Rules:
- Always respond in English regardless of the language of the input.
- Be specific and factual. No vague filler.
- If a URL is provided, treat it as the primary story and search around it for everything else.
- Keep each point concise — 1–2 sentences per item.
- Do not add commentary outside this structure.
- Every single fact, death, date, case, event, quote, or statistic MUST have a source attached, that source must be one of the approved outlets listed above, and the link must be the exact article URL that web_search returned for that fact. Format: Source: [Publication name](https://full-article-url) — the hyperlink is mandatory every time. Never write a bare publication name with no link.

- Never guess, shorten, edit, reconstruct, or invent a URL, and never paste a URL you did not receive from a search result. Copy article URLs exactly as returned.
- If you are listing multiple people or events in one section, each individual item must have its own source with its own article link on the same line.

- Banned sentence types — these are the shapes that unsourced filler takes, and they are forbidden unless a specific article states them and is linked: "authorities began investigating", "details are emerging gradually", "the news spread on social media", "family and friends are calling for justice", "the public awaits further updates", "the case has raised questions about". If you cannot name who said it, when, and in which article, do not write it.
- A timeline entry with no date and no source is filler. Every timeline entry needs a real date (or a dated event) plus its own article link, otherwise delete the entry. An empty timeline is acceptable; a vague one is not.
- Never ask clarifying questions. Respond immediately with the structure.
- If the story is recent or beyond your knowledge cutoff, that is exactly what the web_search tool is for: search for it. Never answer such a story from memory. If the searches genuinely return nothing about this specific person or event, say that plainly at the top of the response and mark the sections NOT FOUND — that is the right answer, and it is far more useful to the researcher than a reconstruction.
- A short, fully sourced answer always beats a long one. Never trade accuracy for completeness.
- The Celebrity appearance & style intelligence section is optional and should only appear when the story is clearly about a celebrity's looks, outfit, styling, beauty routine, body, or cosmetic procedures. Skip it entirely for political, business, or non-appearance-related stories.
- Within the Celebrity appearance & style intelligence section, include only the sub-sections that are directly relevant. Do not force sub-sections that don't apply to the story.`; }

2. Start narrow — headline-level matching:

3. If that returns fewer than 3 relevant hits, broaden in this order: add "body" to the fields, then try the case name or the surname alone, then try the alternative spellings a "${L.esLanguage}" newsroom would use. Only as a last resort drop the language filter — and if a candidate that comes back is not in "${L.esLanguage}", say so at the start of its "why" as [needs translating] and set its "language" field, because the researcher would have to translate it before using it. Run at most 4 searches total, then answer with what you have.
4. Discard: the researcher's own article if it is already in the index; anything with status other than 3; anything that is neither the same case/event nor at least the same person; near-duplicate republications of the same piece (keep the best one).
5. Rank remaining candidates: same case/event first (most recent and most detailed first), then same-person-different-storyline.
6. Return at most 6 candidates. Quality over quantity — returning 2 strong ones is better than padding with weak ones.

## Identifying each candidate
For every candidate return its "id", "public_id", "slug", and "site_id" — where site_id is the FIRST id in the "sites" array. Do not build URLs; the tool constructs them from these four fields.

## Output
Reply with ONE valid JSON object and nothing else — no prose before or after, no markdown code fences.

{
  "topic": "the specific case/event you searched for, one short line",
  "articles": [
    {
      "id": 542936,
      "headline": "exact headline from the CMS",
      "published_at": "2026-05-14",
      "public_id": 542936,
      "slug": "exact-slug-from-the-cms",
      "language": "${L.esLanguage}",
      "site_id": 24,
      "tier": "same_event",
      "why": "one sentence — which part of the same case or event this article covers",
      "use_as": "one or two sentences — what specifically to lift from it as the background section, naming the story elements worth keeping (timestamps, quotes, the turn)",
      "transition": "a ready-to-paste transition line in the article's voice, written in ${L.transitionLanguage} because it goes straight into the finished article — the English equivalent is 'As we previously reported, ...'",
      "repeat_risk": "a quote or fact in this article that already appears in the researcher's input — or null if there is no overlap"
    }
  ],
  "structure_tip": "one line of advice for this specific story, only if it applies: covering several angles at once and saying so in the headline, or holding the biggest reveal until later once the reader is invested. Otherwise null.",
  "notes": "only if you found nothing on the same case/event — say so plainly and state what you searched. Otherwise null."
}

"tier" must be exactly "same_event" or "same_person_other_story".
For "same_person_other_story" candidates, "why" must state plainly that the storyline differs and that the headline has to cover both angles for it to be safe to use.
Everything you write yourself is in English — the only exceptions are the "headline", which is copied verbatim from the CMS, and "transition", which is written in ${L.transitionLanguage} so it can be pasted straight into the article.
Never invent an article, an id, a headline, or a URL. Everything must come from an actual search result. If the search finds nothing usable, return an empty "articles" array and fill in "notes".`; }



// The prompt editor was removed from production: prompts are the constants
// above and are edited in the repo, not in the browser. Clear anything the old
// editor left behind so no one keeps running a stale saved prompt.
try {
  localStorage.removeItem('storyEnricherPrompt');
  localStorage.removeItem('storyEnricherAmoPrompt');
} catch (e) { /* private mode — nothing to clean */ }

// The system prompt and tool list are identical on every turn of the server-side
// search loop, so marking them cached means they are written once and read back
// at a tenth of the price for the rest of the run. Both prompts are comfortably
// over the 1024-token minimum — do not trim them below it or caching silently
// stops applying.
function cached(text) {
  return [{ type: "text", text: text, cache_control: { type: "ephemeral" } }];
}

async function callApi(payload) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const u = data.usage;
  if (u) {
    console.info('[story-enricher] tokens — in ' + u.input_tokens
      + ' | cache write ' + (u.cache_creation_input_tokens || 0)
      + ' | cache read ' + (u.cache_read_input_tokens || 0)
      + ' | out ' + u.output_tokens
      + (u.server_tool_use ? ' | searches ' + u.server_tool_use.web_search_requests : ''));
  }
  return data;
}

// Joined without a separator: with web search the answer arrives as several text
// blocks that can split mid-sentence.
function textOf(data) {
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
}

// Every article URL the search actually returned, so a writer always has real
// links even if the model formatted its own badly.
function citationsOf(data) {
  const out = [], seen = new Set();
  (data.content || []).forEach(b => {
    if (b.type !== 'text' || !Array.isArray(b.citations)) return;
    b.citations.forEach(c => {
      const url = c.url || (c.source && c.source.url);
      if (!url || seen.has(url)) return;
      seen.add(url);
      out.push({ url: url, title: c.title || url });
    });
  });
  return out;
}

function runResearch() {
  const input = document.getElementById('inputText').value.trim();
  if (!input) return;

  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const useAmo = document.getElementById('amoToggle').checked;

  // Frozen for the whole run: switching desks mid-request must not relabel or
  // re-filter a result that was produced for the other one.
  const L = locale();

  btn.disabled = true;
  output.style.display = 'none';
  document.getElementById('resultContent').innerHTML = '';
  document.getElementById('amoContent').innerHTML = '';
  status.innerHTML = 'Searching the web in ' + (L.id === 'us' ? 'English' : L.archiveLabel + ' and English')
    + ' <span class="dot"></span><span class="dot"></span><span class="dot"></span>';

  // Both calls run in parallel — the archive lookup is slower, so it fills in after.
  const enrich = runEnrichment(input, status, output, btn, L);
  if (useAmo) runAmoLookup(input, output, L);
  return enrich;
}

// Runs the search restricted to the active desk's searchableDomains(). Some
// publishers block the
// search crawler, and the API rejects the whole request with a 400 that names
// them — so if that happens, read the names out of the error, drop them, and try
// again. That keeps working if the blocked set changes on Anthropic's side.
// Whatever the search returns, the client-side filter still enforces the full
// approved list, so a failed restriction can never leak an unapproved outlet.
function parseBlockedDomains(message) {
  if (!/not accessible to our user agent/i.test(message)) return [];
  const listPart = message.slice(message.indexOf('['), message.indexOf(']') + 1);
  const found = [];
  listPart.replace(/'([^']+)'/g, (m, d) => { found.push(d.toLowerCase()); return m; });
  return found;
}

async function callWithSearch(base, L) {
  let domains = searchableDomains(L);

  for (let attempt = 1; attempt <= 4; attempt++) {
    const tool = { type: "web_search_20250305", name: "web_search", max_uses: L.maxSearches };
    if (domains.length) tool.allowed_domains = domains;
    try {
      const data = await callApi(Object.assign({}, base, { tools: [tool] }));
      console.info('[story-enricher] search ran across ' + domains.length + ' approved, reachable domains');
      return data;
    } catch (e) {
      const newlyBlocked = parseBlockedDomains(e.message);
      if (newlyBlocked.length) {
        console.warn('[story-enricher] these approved outlets block the search crawler and were dropped: '
          + newlyBlocked.join(', ') + ' — remembered for the ' + L.label
          + ' desk; paste them into SEARCH_BLOCKED_DOMAINS to make it permanent');
        rememberBlocked(L.id, newlyBlocked);
        domains = domains.filter(d => newlyBlocked.indexOf(d) === -1);
        continue;
      }
      console.warn('[story-enricher] search failed: ' + e.message);
      throw e;
    }
  }
  throw new Error('The search could not be run against the approved source list. Nothing was returned rather than risk an unsourced answer.');
}

async function runEnrichment(input, status, output, btn, L) {
  try {
    const data = await callWithSearch({
      model: MODEL,
      max_tokens: 8000,
      system: cached(buildSystemPrompt(L)),
      messages: [{ role: "user", content: input }]
    }, L);

    const box = document.getElementById('resultContent');
    let html = '';
    if (data.stop_reason === 'max_tokens') {
      html += '<div class="warn-line">⚠ response was cut off by the length limit — some sections may be incomplete</div>';
    }
    box.innerHTML = html + renderContent(textOf(data));
    filterOutput(box, citationsOf(data), L);

    output.style.display = 'block';
    status.innerHTML = '';
    output.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    status.innerHTML = '<span style="color:#c87070">Error: ' + escapeHtml(err.message) + '</span>';
  } finally {
    btn.disabled = false;
  }
}

// Sections whose every line must carry a source. Story summary and Storytelling
// angles are editorial judgement, not claims of fact, so they are exempt.
const SOURCED_SECTION_RE = /background|similar|precedent|timeline|appearance|style|surgery|fashion/i;

function normUrl(u) {
  try {
    const p = new URL(u);
    return p.host.replace(/^www\./, '').toLowerCase() + p.pathname.replace(/\/+$/, '').toLowerCase();
  } catch (e) { return String(u); }
}

// Social platforms are allowed for direct quotes from official accounts only.
// Code cannot see a verification badge, but it CAN tell a post from a profile:
// a quote must point at the individual post or video that contains it.
const SOCIAL_POST_PATTERNS = {
  "instagram.com": /\/(p|reel|reels|tv)\//i,
  "threads.net":   /\/post\//i,
  "x.com":         /\/status\//i,
  "twitter.com":   /\/status\//i,
  "tiktok.com":    /\/video\//i,
  "facebook.com":  /\/(posts|videos|photo|permalink|reel|watch|story\.php)/i,
  "youtube.com":   /\/(watch|shorts|live)/i,
  "dailymotion.com": /\/video\//i,
  "youtu.be":      /\/.+/
};

// Returns null when the host is not social, otherwise 'post' or 'profile'.
function socialKind(u) {
  const host = String(u.host || '').replace(/^www\./, '').toLowerCase();
  const key = Object.keys(SOCIAL_POST_PATTERNS)
    .find(d => host === d || host.endsWith('.' + d));
  if (!key) return null;
  const target = u.pathname + u.search;
  return SOCIAL_POST_PATTERNS[key].test(target) ? 'post' : 'profile';
}

// Does this link meet the source standard? Anything that fails is dropped
// silently along with the sentence that leaned on it.
function linkPasses(href, cites, L) {
  let u;
  try { u = new URL(href); } catch (e) { return false; }

  // Must be one of the approved outlets.
  if (!isApprovedHost(u.host, L)) return false;

  const social = socialKind(u);
  // Social is allowed only as a link to the actual post, never an account page.
  if (social === 'profile') return false;
  if (social === 'post') return true;

  // A domain with no path is an outlet homepage, not an article.
  if (u.pathname === '' || u.pathname === '/') return false;

  // The URL has to be one the search actually returned, not one the model wrote
  // from memory. Skipped when the response carried no citations at all.
  if (!cites.length) return true;
  const n = normUrl(href);
  return cites.some(c => {
    const m = normUrl(c.url);
    return m === n || m.startsWith(n) || n.startsWith(m);
  });
}

// Walks the rendered answer and removes every line that does not meet the
// standard: no source, a source off the approved list, a homepage link, a
// social profile link, or a URL that never came back from a search. Sections
// left with nothing are removed entirely. No flags, no warnings in the output.
function filterOutput(container, cites, L) {
  let dropped = 0;

  container.querySelectorAll('.block').forEach(block => {
    const titleEl = block.querySelector('.block-title');
    const title = titleEl ? titleEl.textContent : '';
    const needsSource = SOURCED_SECTION_RE.test(title);
    const p = block.querySelector('p');
    if (!p) return;

    const kept = p.innerHTML.split(/<br\s*\/?>/i).filter(frag => {
      const plain = frag.replace(/<[^>]*>/g, '').trim();
      if (!plain) return false;
      if (plain.length < 25) return true;                    // sub-headings, spacers
      if (/NOT FOUND/i.test(plain)) { dropped++; return false; }

      const hrefs = [];
      frag.replace(/href="([^"]+)"/gi, (m, h) => { hrefs.push(h); return m; });

      if (!hrefs.length) {
        if (needsSource) { dropped++; return false; }        // a claim with no source
        return true;                                         // summary / angles: no claim of fact
      }
      if (hrefs.some(h => !linkPasses(h, cites, L))) { dropped++; return false; }
      return true;
    });

    const substantive = kept.filter(f => f.replace(/<[^>]*>/g, '').trim().length >= 25);
    if (!substantive.length) { block.remove(); return; }
    p.innerHTML = kept.join('<br>');
  });

  if (dropped) {
    const note = document.createElement('div');
    note.className = 'omit-note';
    note.textContent = dropped + ' item(s) without an approved source were left out.';
    container.appendChild(note);
  }
}

async function runAmoLookup(input, output, L) {
  const box = document.getElementById('amoContent');
  output.style.display = 'block';
  box.innerHTML = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>'
    + '<div class="amo-empty">Searching the CMS <span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';

  try {
    const data = await callApi({
      use_amo_es: true,
      model: AMO_MODEL,
      max_tokens: 6000,
      system: cached(buildAmoPrompt(L)),
      messages: [{ role: "user", content: "Primary story the researcher is working on:\n\n" + input }]
    });
    const parsed = extractJson(textOf(data));
    if (!parsed) throw new Error('The archive lookup returned an unreadable answer. Try Generate again.');
    box.innerHTML = renderAmo(parsed);
  } catch (err) {
    box.innerHTML = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>'
      + '<div class="amo-empty" style="color:#c87070">Could not reach the archive: ' + escapeHtml(err.message) + '</div></div>';
  }
}

function extractJson(text) {
  if (!text) return null;
  const cleaned = text.replace(/```json/g, '').replace(/```/g, '').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if (start === -1 || end === -1) return null;
  try {
    return JSON.parse(cleaned.slice(start, end + 1));
  } catch (e) {
    return null;
  }
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderAmo(data) {
  let html = '<div class="block"><div class="block-title">🗂 AMO archive — background you already own</div>';

  if (data.topic) {
    html += '<div class="amo-topic">Searched for: <strong>' + escapeHtml(data.topic) + '</strong></div>';
  }

  const items = Array.isArray(data.articles) ? data.articles : [];

  if (!items.length) {
    html += '<div class="amo-empty">' + escapeHtml(data.notes || 'No AMO articles on this case were found. Write the background from external sources instead.') + '</div>';
    return html + '</div>';
  }

  items.forEach(a => {
    const sameEvent = a.tier !== 'same_person_other_story';
    html += '<div class="amo-item ' + (sameEvent ? 'tier-same' : 'tier-other') + '">';
    html += '<div class="amo-head"><div class="amo-headline">' + escapeHtml(a.headline || 'Untitled') + '</div>'
      + '<div class="amo-badge ' + (sameEvent ? 'badge-same' : 'badge-other') + '">'
      + (sameEvent ? 'Same story' : 'Same person · other story') + '</div></div>';

    const webUrl = a.web_url || amoWebUrl(a);
    const adminUrl = a.admin_url || amoAdminUrl(a);
    const siteName = a.site || SITE_DOMAINS[a.site_id] || null;
    const lang = a.language ? String(a.language).toUpperCase() : null;
    const meta = [a.published_at, siteName, lang, a.id ? 'ID ' + a.id : null].filter(Boolean).map(escapeHtml).join(' · ');
    if (meta) html += '<div class="amo-meta">' + meta + '</div>';

    if (a.why) html += '<div class="amo-line"><span class="k">Why</span>' + escapeHtml(a.why) + '</div>';
    if (a.use_as) html += '<div class="amo-line"><span class="k">Use as</span>' + escapeHtml(a.use_as) + '</div>';
    if (a.transition) html += '<div class="amo-line"><span class="k">Transition</span><em>' + escapeHtml(a.transition) + '</em></div>';
    if (a.repeat_risk) html += '<div class="amo-line warn"><span class="k">Already used</span>' + escapeHtml(a.repeat_risk) + '</div>';

    html += '<div class="amo-links">';
    if (webUrl) html += '<a href="' + escapeHtml(webUrl) + '" target="_blank" rel="noopener">Open on site ↗</a>';
    if (adminUrl) html += '<a href="' + escapeHtml(adminUrl) + '" target="_blank" rel="noopener">Open in CMS ↗</a>';
    html += '</div></div>';
  });

  if (data.structure_tip) {
    html += '<div class="amo-topic" style="margin-top:16px">Structure: <strong>' + escapeHtml(data.structure_tip) + '</strong></div>';
  }
  if (data.notes) {
    html += '<div class="amo-topic">' + escapeHtml(data.notes) + '</div>';
  }

  return html + '</div>';
}

function renderContent(text) {
  const sections = text.split(/\n---\n/);
  return sections.map(sec => {
    sec = sec.trim();
    if (!sec) return '';
    const lines = sec.split('\n');
    let title = '', body = [];
    if (lines[0].startsWith('**') && lines[0].endsWith('**')) {
      title = lines[0].replace(/\*\*/g,'').replace(/\*/g,'').trim();
      body = lines.slice(1);
    } else {
      body = lines;
    }
    const html = body.join('\n')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/\[([^\]]+)\]\((https?[^\)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g,'<br>');
    return `<div class="block">${title ? `<div class="block-title">${title}</div>` : ''}<p>${html}</p></div>`;
  }).join('');
}

function copyResult() {
  const main = document.getElementById('resultContent').innerText;
  const amo = document.getElementById('amoContent').innerText;
  const text = [main, amo].filter(t => t.trim()).join('\n\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelectorAll('.tool-btn')[0];
    btn.textContent = 'Copied';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

function clearResults() {
  document.getElementById('output').style.display = 'none';
  document.getElementById('resultContent').innerHTML = '';
  document.getElementById('amoContent').innerHTML = '';
  document.getElementById('status').innerHTML = '';
}

function resetTool() {
  document.getElementById('inputText').value = '';
  clearResults();
  document.getElementById('inputText').focus();
}

document.getElementById('inputText').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) runResearch();
});

paintLocale();
</script>
